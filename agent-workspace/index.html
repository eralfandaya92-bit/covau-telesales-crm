<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Covau Agent Workspace Demo</title><style>:root{--navy:#0d3b66;--blue:#1686d9;--bg:#f4f7fb;--line:#d5e0ea;--text:#10213a;--muted:#66788d;--green:#079669;--red:#ef3340}*{box-sizing:border-box}body{margin:0;font:14px Arial,sans-serif;background:var(--bg);color:var(--text)}header{height:64px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 22px;position:sticky;top:0;z-index:4}.brand{font-size:20px;font-weight:800}.demo{font-size:11px;font-weight:800;background:#fff4cc;padding:7px 10px;border-radius:20px}.top{padding:16px 20px 8px;display:flex;justify-content:space-between;gap:10px;align-items:center}.wrap{padding:8px 20px 24px;display:grid;grid-template-columns:370px minmax(520px,1fr) 380px;gap:14px;max-width:1700px;margin:auto}.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px}.section{font-size:16px;font-weight:800;margin:18px 0 10px}.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.space{justify-content:space-between}.btn{border:1px solid #cbd8e4;background:#edf4f9;color:#123d63;border-radius:8px;padding:10px 14px;font-weight:700;cursor:pointer}.btn:hover{filter:brightness(.97)}.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}.btn.green{color:var(--green);border-color:#9bdcc7}.btn.red{background:var(--red);border-color:var(--red);color:#fff}.tabs{display:flex;gap:8px;margin-bottom:12px}.tabs .active{background:var(--blue);color:#fff;border-color:var(--blue)}input,select,textarea{width:100%;padding:10px 12px;border:1px solid #bfd0df;border-radius:8px;background:#fff;color:var(--text)}textarea{min-height:82px;resize:vertical}label{display:block;font-size:12px;color:#8094ad;margin:9px 0 5px}.split{display:grid;grid-template-columns:1fr 1fr;gap:12px}.line{border-top:1px solid var(--line);margin:14px 0}.info{display:grid;grid-template-columns:105px 1fr;gap:8px;padding:9px 7px;border-bottom:1px solid var(--line)}.pill{display:inline-block;padding:5px 8px;border-radius:999px;background:#e8f2fa;font-size:11px}.score{background:#e8f7f3;color:#07805b}.action{border:1px solid #ffb8bd;background:#fff1f2;border-radius:10px;padding:14px}.action h3{margin:0 0 10px}.activity{border-left:2px solid var(--navy);padding-left:16px;margin:8px}.event{margin:0 0 18px}.event b{display:block}.event small{color:var(--muted)}.history .item{display:grid;grid-template-columns:1fr auto;gap:8px;border-bottom:1px solid var(--line);padding:12px 0}.history b{display:block}.muted{color:var(--muted)}.callbar{display:none;background:#eef9ff;border:1px solid #a8daf6;border-radius:10px;padding:12px;margin-bottom:12px}.callbar.show{display:block}.live{color:var(--green);font-weight:800}.modal{display:none;position:fixed;inset:0;background:#10213a88;align-items:center;justify-content:center;z-index:20}.modal.show{display:flex}.modal .card{width:min(560px,92vw)}.toast{display:none;position:fixed;right:20px;bottom:20px;background:#10213a;color:#fff;padding:13px 17px;border-radius:9px;z-index:30}.queue{max-width:220px}a{color:#1476c5;text-decoration:none}@media(max-width:1250px){.wrap{grid-template-columns:330px 1fr}.right{grid-column:1/-1}}@media(max-width:800px){.wrap{grid-template-columns:1fr;padding:10px}.top{padding:12px}.split{grid-template-columns:1fr}}</style></head><body><header><div><div class="brand">COVAU TELESALES CRM — AGENT WORKSPACE</div><small class="muted">Interactive approval prototype</small></div><div class="demo">DEMO • FICTIONAL DATA ONLY</div></header><div class="top"><div><b>Agent Workspace</b> <span class="pill">Agent A</span></div><div class="row"><select id="leadPicker" class="queue" onchange="switchLead(this.value)"></select><button class="btn" onclick="location.href='/full-demo/'">← Full Demo</button></div></div><main class="wrap"><section class="card" id="left"></section><section><div class="card"><div class="tabs"><button class="btn active" onclick="tab(this,'activityForm')">Activity</button><button class="btn" onclick="openModal('call')">Log Call</button><button class="btn" onclick="openModal('sms')">Send SMS</button><button class="btn" onclick="openModal('email')">Send Email</button><button class="btn" onclick="openModal('follow')">Set Follow-up</button><button class="btn" onclick="openModal('note')">Add Note</button></div><div id="callbar" class="callbar"><div class="row space"><div><span class="live">● CALL IN PROGRESS</span><br><b id="timer">00:00</b> • <span id="dialNumber"></span></div><button class="btn red" onclick="endCall()">End Call</button></div></div><div id="activityForm"><div class="tabs"><button class="btn active">Call Result</button><button class="btn" onclick="openModal('sms')">SMS</button><button class="btn" onclick="openModal('email')">Email</button><button class="btn" onclick="openModal('note')">Note</button></div><div class="split"><div><label>Call Outcome *</label><select id="outcome"><option>Talked to Owner</option><option>Talked to Gatekeeper</option><option>Answering Machine</option><option>Early Hangup</option><option>No Answer</option><option>Callback Requested</option><option>Invoice Received</option></select></div><div><label>Lead Tag / Next Status *</label><select id="status"><option>Awaiting Invoice</option><option>Talked to Owner</option><option>Talked to Gatekeeper</option><option>Answering Machine</option><option>Early Hangup</option><option>No Answer</option><option>Invoice Received</option><option>Pricing Requested</option><option>Quote Link Sent</option><option>Converted</option></select></div></div><label>Call Notes *</label><textarea id="notes">Spoke with Michael (Operations Manager). Requested latest electricity invoice. Will send email with required documents.</textarea><div class="row"><input id="followCheck" type="checkbox" checked style="width:auto"><b>Set Follow-up</b></div><div class="split"><input id="fdate" type="date"><input id="ftime" type="time" value="14:30"></div><button class="btn primary" style="display:block;width:60%;margin:10px auto 0" onclick="saveCall()">☎ Save Call Result & Next Lead →</button></div></div><div class="card" style="margin-top:14px"><div class="row space"><h2 style="margin:0">Most Recent Activity</h2><span class="pill">All Activities</span></div><div id="recent" class="activity"></div></div></section><aside class="right"><div class="card"><div class="row space"><h2 style="margin:0">Next Action</h2><button class="btn" onclick="openModal('calendar')">▣ View Calendar</button></div><div id="nextAction"></div></div><div class="card history" style="margin-top:14px"><div class="row space"><h2 style="margin:0">Activity History (<span id="hcount">0</span>)</h2><button class="btn" onclick="showAll()">View All</button></div><div id="history"></div></div></aside></main><div id="modal" class="modal"><div class="card"><div class="row space"><h2 id="mtitle">Action</h2><button class="btn" onclick="closeModal()">✕</button></div><div id="mbody"></div></div></div><div id="toast" class="toast"></div><script>const seed=[{name:'ABC Manufacturing Pty Ltd',industry:'Metal Fabrication',state:'NSW',phone:'02 9123 4567',mobile:'0412 345 678',email:'accounts@abcmfg.com.au',abn:'12 345 678 901',address:'Unit 4/12 Industrial Ave, Smithfield NSW 2164',website:'www.abcmfg.com.au',source:'Lead Mine',sub:'Google Maps',tag:'Talked to Owner',score:78,contact:'Michael',role:'Operations Manager'},{name:'Harbourview Cafe Pty Ltd',industry:'Cafe',state:'NSW',phone:'02 9555 0188',mobile:'0421 700 212',email:'manager@harbourviewdemo.com.au',abn:'31 445 992 105',address:'18 Bay Street, Sydney NSW 2000',website:'www.harbourviewdemo.com.au',source:'Lead Mine',sub:'Google Maps',tag:'New',score:86,contact:'Sarah',role:'Owner'},{name:'Southern Cross Laundry',industry:'Laundry',state:'VIC',phone:'03 9012 7755',mobile:'0433 810 201',email:'office@scldemo.com.au',abn:'52 110 887 342',address:'77 Market Road, Dandenong VIC 3175',website:'www.scldemo.com.au',source:'Business Directory',sub:'Cylex',tag:'Awaiting Invoice',score:82,contact:'Daniel',role:'Director'}];let data=JSON.parse(localStorage.getItem('agentWorkspaceDemo')||'null')||seed.map((x,i)=>({...x,id:i,follow:{date:new Date().toISOString().slice(0,10),time:'14:30',objective:'Check if latest electricity invoice has been received.'},history:[{type:'Outbound Call',text:'Spoke with '+x.contact+'. Requested latest electricity invoice.',time:'Today, 10:45 AM'},{type:'Email Sent',text:'Requested Latest Electricity Invoice',time:'Today, 11:15 AM'},{type:'Follow-up Scheduled',text:'2:30 PM',time:'Today, 11:16 AM'},{type:'Inbound Call',text:'Spoke with receptionist.',time:'26 Sep'},{type:'Note Added',text:'Office hours 8am - 5pm.',time:'25 Sep'}]}));let current=0,tick=null,secs=0;const save=()=>localStorage.setItem('agentWorkspaceDemo',JSON.stringify(data));const now=()=>new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});function toast(s){let t=document.getElementById('toast');t.textContent=s;t.style.display='block';setTimeout(()=>t.style.display='none',2200)}function render(){let l=data[current];leadPicker.innerHTML=data.map((x,i)=>`<option value="${i}" ${i==current?'selected':''}>${x.name}</option>`).join('');left.innerHTML=`<div class="row space"><h2>Lead Details</h2><button class="btn" onclick="openModal('edit')">✎ Edit</button></div><h1>${l.name}</h1><div class="row space"><span class="muted">${l.industry} • ${l.state}</span><span class="pill">${l.tag.toUpperCase()}</span></div><div class="section">Contact Information</div><p>☎ &nbsp; ${l.phone}</p><p>▣ &nbsp; ${l.mobile}</p><p>✉ &nbsp; ${l.email}</p><div class="line"></div><div class="section">Business Details</div><div class="info"><span>ABN</span><b>${l.abn}</b></div><div class="info"><span>Address</span><span>${l.address}</span></div><div class="info"><span>Website</span><a href="#">${l.website}</a></div><div class="section">Lead Information</div><div class="info"><span>Lead Source</span><span>${l.source}</span></div><div class="info"><span>Sub Source</span><span>${l.sub}</span></div><div class="info"><span>Assigned To</span><span>Agent A</span></div><div class="info"><span>Lead Tag</span><span>${l.tag}</span></div><div class="info"><span>Lead Score</span><span><i class="pill score">${l.score} (High)</i></span></div><div class="info"><span>First Assigned</span><span>18 Sept 2026</span></div>`;renderHistory();renderNext();}function renderHistory(){let h=data[current].history;hcount.textContent=h.length;history.innerHTML=h.slice(0,6).map(x=>`<div class="item"><div><b>${icon(x.type)} ${x.type}</b><span>${x.text}</span></div><small>${x.time}</small></div>`).join('');recent.innerHTML=h.slice(0,3).map(x=>`<div class="event"><b>${icon(x.type)} ${x.type}</b><span>${x.text}</span><br><small>Agent A • ${x.time}</small></div>`).join('')}function icon(t){return t.includes('Call')?'☎':t.includes('Email')?'✉':t.includes('SMS')?'▣':t.includes('Follow')?'▣':'▤'}function renderNext(){let l=data[current],f=l.follow;nextAction.innerHTML=f?`<div class="action" style="margin-top:14px"><div class="row space"><h3>▣ Follow-up Call</h3><span class="pill">Due Today</span></div><p style="color:var(--red)">Due: ${f.date}, ${f.time}</p></div><h3>Objective</h3><p>${f.objective}</p><button class="btn primary" style="width:100%" onclick="startDial()">☎ Start Dial</button><div class="split" style="margin-top:10px"><button class="btn green" onclick="openModal('sms')">▣ Send SMS</button><button class="btn" onclick="openModal('email')">✉ Send Email</button></div>`:`<p class="muted">No follow-up scheduled.</p><button class="btn primary" onclick="openModal('follow')">Set Follow-up</button>`}function switchLead(i){current=+i;render()}function add(type,text){data[current].history.unshift({type,text,time:'Today, '+now()});save();render()}function startDial(){secs=0;callbar.classList.add('show');dialNumber.textContent=data[current].phone;clearInterval(tick);tick=setInterval(()=>{secs++;timer.textContent=String(Math.floor(secs/60)).padStart(2,'0')+':'+String(secs%60).padStart(2,'0')},1000);toast('Dialling '+data[current].name)}function endCall(){clearInterval(tick);callbar.classList.remove('show');add('Outbound Call','Call ended • '+timer.textContent);toast('Call logged')}function saveCall(){let l=data[current];l.tag=status.value;add('Outbound Call',outcome.value+' — '+notes.value);if(followCheck.checked){l.follow={date:fdate.value,time:ftime.value,objective:'Follow up on '+status.value.toLowerCase()+'.'};add('Follow-up Scheduled',fdate.value+' '+ftime.value)}save();toast('Call result saved. Loading next lead…');current=(current+1)%data.length;setTimeout(render,500)}function openModal(type){let l=data[current];modal.classList.add('show');let title='',body='';if(type==='sms'){title='Send SMS';body=`<label>To</label><input value="${l.mobile}"><label>Message</label><textarea id="mtext">Hi ${l.contact}, this is Agent A from Covau Energy. Following up regarding your business electricity account.</textarea><button class="btn primary" onclick="sendAction('SMS Sent',mtext.value)">Send SMS</button>`}else if(type==='email'){title='Send Email';body=`<label>To</label><input value="${l.email}"><label>Subject</label><input id="subj" value="Requested Latest Electricity Invoice"><label>Message</label><textarea id="mtext">Hi ${l.contact}, thank you for your time. Please reply with a copy of your latest electricity invoice so our pricing team can review it.</textarea><button class="btn primary" onclick="sendAction('Email Sent',subj.value)">Send Email</button>`}else if(type==='note'){title='Add Note';body=`<label>Note</label><textarea id="ntext" placeholder="Add internal lead note"></textarea><button class="btn primary" onclick="sendAction('Note Added',ntext.value)">Save Note</button>`}else if(type==='follow'){title='Set Follow-up';body=`<label>Date</label><input id="fd" type="date" value="${new Date().toISOString().slice(0,10)}"><label>Time</label><input id="ft" type="time" value="14:30"><label>Objective</label><textarea id="fo">Check if latest electricity invoice has been received.</textarea><button class="btn primary" onclick="setFollow()">Schedule Follow-up</button>`}else if(type==='call'){title='Log Call';body=`<label>Call outcome</label><select id="co"><option>Talked to Owner</option><option>Talked to Gatekeeper</option><option>No Answer</option><option>Answering Machine</option></select><label>Notes</label><textarea id="cn"></textarea><button class="btn primary" onclick="sendAction('Outbound Call',co.value+' — '+cn.value)">Save Call</button>`}else if(type==='edit'){title='Edit Lead';body=`<label>Business Name</label><input id="en" value="${l.name}"><label>Phone</label><input id="ep" value="${l.phone}"><label>Email</label><input id="ee" value="${l.email}"><button class="btn primary" onclick="editLead()">Save Changes</button>`}else{title='Follow-up Calendar';body=data.map(x=>x.follow?`<div class="info"><b>${x.follow.date} ${x.follow.time}</b><span>${x.name}<br><small>${x.follow.objective}</small></span></div>`:'').join('')||'<p>No scheduled follow-ups.</p>'}mtitle.textContent=title;mbody.innerHTML=body}function closeModal(){modal.classList.remove('show')}function sendAction(t,x){if(!x.trim())return toast('Please enter details first');add(t,x);closeModal();toast(t+' successfully')}function setFollow(){data[current].follow={date:fd.value,time:ft.value,objective:fo.value};add('Follow-up Scheduled',fd.value+' '+ft.value+' — '+fo.value);closeModal();toast('Follow-up scheduled')}function editLead(){Object.assign(data[current],{name:en.value,phone:ep.value,email:ee.value});save();closeModal();render();toast('Lead updated')}function showAll(){openModal('calendar');mtitle.textContent='Complete Activity History';mbody.innerHTML=data[current].history.map(x=>`<div class="info"><b>${icon(x.type)} ${x.type}</b><span>${x.text}<br><small>${x.time}</small></span></div>`).join('')}fdate.value=new Date().toISOString().slice(0,10);render();</script></body></html>
